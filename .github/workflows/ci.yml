name: CI

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        env:
          PORADAR_HOME: ${{ runner.temp }}/poradar-home
          OLLAMA_HOST: http://127.0.0.1:1
        run: python -m pytest -q
      - name: Hero loop smoke (zero keys, no network)
        env:
          PORADAR_HOME: ${{ runner.temp }}/poradar-home
          OLLAMA_HOST: http://127.0.0.1:1
        run: |
          poradar scan tests/fixtures/wire_report.txt --offline --no-brief --json | python -c "import sys,json; d=json.load(sys.stdin); assert d['band'] in ('quiet','watch'), d['band']; print('wire report:', d['band'], d['ers'])"
          poradar scan tests/fixtures/outrage_bait.txt --offline --no-brief --json | python -c "import sys,json; d=json.load(sys.stdin); assert d['band']=='watch' and d['mode']=='lexical-only', (d['band'], d['mode']); print('outrage bait:', d['band'], d['ers'])"
